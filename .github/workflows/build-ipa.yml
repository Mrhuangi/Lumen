name: Build unsigned IPA

# 在 GitHub 的 macOS 云主机上把「Lumen」编译成未签名 IPA，
# 产物挂到 Release 供下载，再用手机上的签名工具（全能签 / ESign / Feather 等）+ 证书签名安装。
#
# 发版规矩：每次发版必须先在 Lumen/Changelog.swift 最上方同步新增一条更新日志，
# 否则不发版（App 内「设置 → 关于 → 更新日志」直接读那份数据）。
#
# 注意：不要给 SPM 加 actions/cache 缓存。build #11 实测恢复的缓存让包产物
# 路径错位（Products/Release 而非 Release-iphoneos），链接阶段找不到
# _MPVKit.o／_FFmpeg.o；#10 无缓存时产物路径正常。宁可每次全量拉取。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch subtitle fonts (Noto Sans CJK SC, SIL OFL 1.1)
        run: |
          set -euo pipefail
          mkdir -p Lumen/SubtitleFonts
          BASE="https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/OTF/SimplifiedChinese"
          cd Lumen/SubtitleFonts
          for f in NotoSansCJKsc-Thin.otf NotoSansCJKsc-Light.otf NotoSansCJKsc-Regular.otf NotoSansCJKsc-DemiLight.otf NotoSansCJKsc-Medium.otf NotoSansCJKsc-Bold.otf NotoSansCJKsc-Black.otf; do
            curl -fL --retry 3 -o "$f" "$BASE/$f"
          done
          curl -fL --retry 3 -o OFL.txt "https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/LICENSE"
          cat > fonts.sha256 <<'EOF'
          89bb8179d1b285ac0ca236b37ff29929ee3cc4526048dc11630a55728063e5ba  NotoSansCJKsc-Thin.otf
          e78bbbe1573bbb006156c1198f5c8cd6329470cb6e0b6702c7a3c83913db4abf  NotoSansCJKsc-Light.otf
          2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  NotoSansCJKsc-Regular.otf
          4600700d1b10c8e82074de7c91fa60d2ff5d0a7b9588edea6ab0929424b1699f  NotoSansCJKsc-DemiLight.otf
          ca094f6b0001fb048ca39ddd797a0cdb0179e1e55c6561e111c49c3e6a61d7b7  NotoSansCJKsc-Medium.otf
          b5f0d1a190a7f9b43c310a8850630af12553df32c4c050543f9059732d9b4c0a  NotoSansCJKsc-Bold.otf
          2267c4a0312d267dff8c0d1609948f7d949a3da8be3e126f5e2690cb9cc883b4  NotoSansCJKsc-Black.otf
          6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2  OFL.txt
          EOF
          shasum -a 256 -c fonts.sha256
          rm fonts.sha256
          ls -lh

      - name: Generate app icon
        run: |
          pip3 install --break-system-packages --quiet pillow
          python3 tools/make_icons_ci.py

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Lumen-unsigned.ipa Payload

      - name: Build for iOS 27 simulator
        run: |
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Simulator smoke test (iOS 27, dual size)
        timeout-minutes: 45
        run: |
          set -x
          SIM_APP=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          echo "Simulator app: $SIM_APP"
          mkdir -p sim-evidence
          # xcode-27 镜像自带工具链里没有 ffmpeg（#51/#52 实测 which 为空，
          # 测试视频一直是 dummy 占位、从未真播过）。用 imageio-ffmpeg 的
          # 静态二进制兜底，确保冒烟用的是真视频。
          FFMPEG=""
          if command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG=$(command -v ffmpeg)
          else
            pip3 install --break-system-packages --quiet imageio-ffmpeg || true
            FFMPEG=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())" 2>/dev/null || true)
          fi
          export FFMPEG
          echo "ffmpeg resolved to: $FFMPEG"
          # ffmpeg 必须有界：#80 实测 libx264 编码挂死 45 分钟（-v error 无输出、MKV 未生成，
          # 连 || 兜底的 mpeg4 编码都没触发，因为挂死的进程从不返回）。后台进程＋限时等待包一层，
          # 超时杀掉返回非零，兜底编码才能接上；-nostdin 排除 stdin 等待这一类挂死。
          run_ffmpeg() {
            "$@" &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ $waited -ge 300 ]; then kill "$pid" 2>/dev/null || true; sleep 2; kill -9 "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null; return 1; fi
              sleep 5; waited=$((waited + 5))
            done
            wait "$pid" 2>/dev/null
          }
          # 模拟器启动必须有界：bootstatus -b 会无限等下去（#79 实测在
          # iPhone 17e 上卡 6 小时，日志最后一条就是它）。改走轮询：
          # 180 秒内等不到 Booted 就关机＋抹除后重试一次，再不行跳过该机型、不卡死整步。
          wait_booted() {
            local udid="$1" waited=0
            while [ $waited -lt 180 ]; do
              if xcrun simctl list devices 2>/dev/null | grep "$udid" | grep -q "(Booted)"; then return 0; fi
              sleep 5; waited=$((waited + 5))
            done
            return 1
          }
          boot_sim() {
            local udid="$1"
            xcrun simctl boot "$udid" 2>/dev/null || true
            if wait_booted "$udid"; then return 0; fi
            echo "Simulator $udid did not boot, retrying after erase" >&2
            xcrun simctl shutdown "$udid" 2>/dev/null || true
            xcrun simctl erase "$udid" 2>/dev/null || true
            xcrun simctl boot "$udid" 2>/dev/null || true
            if wait_booted "$udid"; then return 0; fi
            echo "SKIP: simulator $udid failed to boot" >&2
            return 1
          }
          SMOKE_OK=0
          run_smoke() {
            UDID="$1"; SLUG="$2"
            echo "=== Smoke test: $SLUG ($UDID) ==="
            if ! boot_sim "$UDID"; then return 0; fi
            xcrun simctl install "$UDID" "$SIM_APP"
            DATA=$(xcrun simctl get_app_container "$UDID" com.mrhuangi.lumen data)
            echo "Data container: $DATA"
            mkdir -p "$DATA/Documents/Wednesday"
            { echo "ffmpeg=$FFMPEG"; "$FFMPEG" -version 2>/dev/null | head -n 2; } > "sim-evidence/tools-$SLUG.txt" 2>&1 || true
            gen_video() {
              printf '1\n00:00:01,000 --> 00:00:12,000\nGATE SUBTITLE TEST\n\n2\n00:00:13,000 --> 00:00:29,000\nGATE SUBTITLE TEST\n' > "$DATA/Documents/Wednesday/gate.srt"
              run_ffmpeg "$FFMPEG" -nostdin -y -v error -f lavfi -i testsrc2=duration=30:size=1280x720:rate=30 -f lavfi -i sine=frequency=440:duration=30 -i "$DATA/Documents/Wednesday/gate.srt" -map 0:v -map 1:a -map 2:s -c:v libx264 -pix_fmt yuv420p -c:a aac -c:s srt -metadata:s:s:0 language=chi -metadata:s:s:0 title="简体中字" -shortest "$1" 2>>"sim-evidence/ffmpeg-$SLUG.log" || \
              run_ffmpeg "$FFMPEG" -nostdin -y -v error -f lavfi -i testsrc2=duration=30:size=1280x720:rate=30 -f lavfi -i sine=frequency=440:duration=30 -i "$DATA/Documents/Wednesday/gate.srt" -map 0:v -map 1:a -map 2:s -c:v mpeg4 -pix_fmt yuv420p -c:a aac -c:s srt -metadata:s:s:0 language=chi -metadata:s:s:0 title="简体中字" -shortest "$1" 2>>"sim-evidence/ffmpeg-$SLUG.log" || true
              ls -lh "$1" >> "sim-evidence/tools-$SLUG.txt" 2>&1 || true
            }
            if [ -n "$FFMPEG" ]; then
              gen_video "$DATA/Documents/Wednesday/Wednesday.S02E02.2160p.WEB-DL.DDP5.1.mkv"
              gen_video "$DATA/Documents/Wednesday/Wednesday.S02E03.2160p.WEB-DL.DDP5.1.mkv"
            fi
            if [ ! -s "$DATA/Documents/Wednesday/Wednesday.S02E02.2160p.WEB-DL.DDP5.1.mkv" ]; then
              printf 'dummy' > "$DATA/Documents/Wednesday/Wednesday.S02E02.2160p.WEB-DL.DDP5.1.mkv"
              printf 'dummy' > "$DATA/Documents/Wednesday/Wednesday.S02E03.2160p.WEB-DL.DDP5.1.mkv"
            fi
            xcrun simctl launch "$UDID" com.mrhuangi.lumen
            sleep 14
            xcrun simctl io "$UDID" screenshot "sim-evidence/sim-$SLUG.png" || true
            xcrun simctl terminate "$UDID" com.mrhuangi.lumen || true
            sleep 1
            xcrun simctl launch "$UDID" com.mrhuangi.lumen -autoplayFirst || true
            sleep 10
            xcrun simctl io "$UDID" screenshot "sim-evidence/sim-$SLUG-player.png" || true
            sleep 5
            xcrun simctl io "$UDID" screenshot "sim-evidence/sim-$SLUG-player2.png" || true
            # player3（#93/#95 教训）：再等 8 秒截一张，视频约 20–24 秒、深处第二条字幕 cue 内，
            # 专用于判定字幕跨过第一条 cue 间隙后是否持续渲染；player2 落在 12–13 秒间隙里时无字幕是正确的，
            # 不能当作字幕缺失的证据。
            sleep 8
            xcrun simctl io "$UDID" screenshot "sim-evidence/sim-$SLUG-player3.png" || true
            for PANEL in subtitle audio episodes settings; do
              xcrun simctl terminate "$UDID" com.mrhuangi.lumen || true
              sleep 1
              xcrun simctl launch "$UDID" com.mrhuangi.lumen -autoplayFirst -smokePanel "$PANEL" || true
              sleep 16
              xcrun simctl io "$UDID" screenshot "sim-evidence/sim-$SLUG-panel-$PANEL.png" || true
            done
            xcrun simctl terminate "$UDID" com.mrhuangi.lumen || true
            sleep 1
            xcrun simctl launch "$UDID" com.mrhuangi.lumen -autoplayFirst -smokeBgCycle || true
            sleep 22
            xcrun simctl io "$UDID" screenshot "sim-evidence/sim-$SLUG-bgcycle.png" || true
            xcrun simctl terminate "$UDID" com.mrhuangi.lumen || true
            sleep 1
            xcrun simctl launch "$UDID" com.mrhuangi.lumen -smokeSettings || true
            sleep 6
            xcrun simctl io "$UDID" screenshot "sim-evidence/sim-$SLUG-settings.png" || true
            xcrun simctl terminate "$UDID" com.mrhuangi.lumen || true
            sleep 1
            xcrun simctl launch "$UDID" com.mrhuangi.lumen -settings.liquidGlass false -autoplayFirst -smokePanel audio || true
            sleep 16
            xcrun simctl io "$UDID" screenshot "sim-evidence/sim-$SLUG-noglass.png" || true
            find "$DATA/Documents" -type f > "sim-evidence/documents-$SLUG.txt" || true
            PREFS="$DATA/Library/Preferences/com.mrhuangi.lumen.plist"
            if [ -f "$PREFS" ]; then plutil -p "$PREFS" > "sim-evidence/preferences-$SLUG.txt" || true; fi
            SMOKE_OK=$((SMOKE_OK + 1))
          }
          DEVICES=$(xcrun simctl list devices available)
          SMALL=$(echo "$DEVICES" | grep "iPhone SE" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$SMALL" ]; then
            SMALL=$(echo "$DEVICES" | grep "iPhone" | grep -vE "Pro|Plus|Max|Air" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          fi
          LARGE=$(echo "$DEVICES" | grep "iPhone" | grep "Pro Max" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -n "$SMALL" ]; then run_smoke "$SMALL" small; fi
          if [ -n "$LARGE" ] && [ "$LARGE" != "$SMALL" ]; then run_smoke "$LARGE" promax; fi
          if [ -z "$SMALL" ] && [ -z "$LARGE" ]; then
            UDID=$(echo "$DEVICES" | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
            run_smoke "$UDID" single
          fi
          if [ "$SMOKE_OK" -eq 0 ]; then echo "ERROR: no simulator booted, smoke evidence is empty" >&2; exit 1; fi

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-simulator-evidence
          path: sim-evidence
          if-no-files-found: ignore

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-unsigned-ipa
          path: Lumen-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumen 未签名 IPA · build-${{ github.run_number }}
          files: Lumen-unsigned.ipa
          fail_on_unmatched_files: true
