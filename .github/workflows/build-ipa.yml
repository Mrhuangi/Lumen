name: Build unsigned IPA

# 在 GitHub 的 macOS 云主机上把「Lumen」编译成未签名 IPA，
# 产物挂到 Release 供下载，再用手机上的签名工具（全能签 / ESign / Feather 等）+ 证书签名安装。
#
# 发版规矩：每次发版必须先在 Lumen/Changelog.swift 最上方同步新增一条更新日志，
# 否则不发版（App 内「设置 → 关于 → 更新日志」直接读那份数据）。
#
# 注意：不要给 SPM 加 actions/cache 缓存。build #11 实测恢复的缓存让包产物
# 路径错位（Products/Release 而非 Release-iphoneos），链接阶段找不到
# _MPVKit.o／_FFmpeg.o；#10 无缓存时产物路径正常。宁可每次全量拉取。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch subtitle fonts (Noto Sans CJK SC, SIL OFL 1.1)
        run: |
          set -euo pipefail
          mkdir -p Lumen/SubtitleFonts
          BASE="https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/OTF/SimplifiedChinese"
          cd Lumen/SubtitleFonts
          for f in NotoSansCJKsc-Thin.otf NotoSansCJKsc-Light.otf NotoSansCJKsc-Regular.otf NotoSansCJKsc-DemiLight.otf NotoSansCJKsc-Medium.otf NotoSansCJKsc-Bold.otf NotoSansCJKsc-Black.otf; do
            curl -fL --retry 3 -o "$f" "$BASE/$f"
          done
          curl -fL --retry 3 -o OFL.txt "https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/LICENSE"
          cat > fonts.sha256 <<'EOF'
          89bb8179d1b285ac0ca236b37ff29929ee3cc4526048dc11630a55728063e5ba  NotoSansCJKsc-Thin.otf
          e78bbbe1573bbb006156c1198f5c8cd6329470cb6e0b6702c7a3c83913db4abf  NotoSansCJKsc-Light.otf
          2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  NotoSansCJKsc-Regular.otf
          4600700d1b10c8e82074de7c91fa60d2ff5d0a7b9588edea6ab0929424b1699f  NotoSansCJKsc-DemiLight.otf
          ca094f6b0001fb048ca39ddd797a0cdb0179e1e55c6561e111c49c3e6a61d7b7  NotoSansCJKsc-Medium.otf
          b5f0d1a190a7f9b43c310a8850630af12553df32c4c050543f9059732d9b4c0a  NotoSansCJKsc-Bold.otf
          2267c4a0312d267dff8c0d1609948f7d949a3da8be3e126f5e2690cb9cc883b4  NotoSansCJKsc-Black.otf
          6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2  OFL.txt
          EOF
          shasum -a 256 -c fonts.sha256
          rm fonts.sha256
          ls -lh

      - name: Generate app icon
        run: |
          pip3 install --break-system-packages --quiet pillow
          python3 tools/make_icons_ci.py

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Lumen-unsigned.ipa Payload

      - name: Build for iOS 27 simulator
        run: |
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Simulator smoke test (iOS 27, dual size)
        continue-on-error: true
        run: |
          set -x
          SIM_APP=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          echo "Simulator app: $SIM_APP"
          mkdir -p sim-evidence
          run_smoke() {
            UDID="$1"; SLUG="$2"
            echo "=== Smoke test: $SLUG ($UDID) ==="
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$SIM_APP"
            DATA=$(xcrun simctl get_app_container "$UDID" com.mrhuangi.lumen data)
            echo "Data container: $DATA"
            mkdir -p "$DATA/Documents/TestShow"
            printf 'dummy' > "$DATA/Documents/TestShow/TestShow.S01E01.2160p.WEB-DL.mkv"
            printf 'dummy' > "$DATA/Documents/TestShow/TestShow.S01E02.2160p.WEB-DL.mkv"
            xcrun simctl launch "$UDID" com.mrhuangi.lumen
            sleep 6
            xcrun simctl io "$UDID" screenshot "sim-evidence/sim-$SLUG.png" || true
            find "$DATA/Documents" -type f > "sim-evidence/documents-$SLUG.txt" || true
            PREFS="$DATA/Library/Preferences/com.mrhuangi.lumen.plist"
            if [ -f "$PREFS" ]; then plutil -p "$PREFS" > "sim-evidence/preferences-$SLUG.txt" || true; fi
          }
          DEVICES=$(xcrun simctl list devices available)
          SMALL=$(echo "$DEVICES" | grep "iPhone SE" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$SMALL" ]; then
            SMALL=$(echo "$DEVICES" | grep "iPhone" | grep -vE "Pro|Plus|Max|Air" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          fi
          LARGE=$(echo "$DEVICES" | grep "iPhone" | grep "Pro Max" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -n "$SMALL" ]; then run_smoke "$SMALL" small; fi
          if [ -n "$LARGE" ] && [ "$LARGE" != "$SMALL" ]; then run_smoke "$LARGE" promax; fi
          if [ -z "$SMALL" ] && [ -z "$LARGE" ]; then
            UDID=$(echo "$DEVICES" | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
            run_smoke "$UDID" single
          fi

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-simulator-evidence
          path: sim-evidence
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-unsigned-ipa
          path: Lumen-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumen 未签名 IPA · build-${{ github.run_number }}
          files: Lumen-unsigned.ipa
          fail_on_unmatched_files: true
